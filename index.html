<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ジェネラティブ万華鏡</title>
<style>
  :root {
    --bg: #0b0b12;
    --panel: rgba(20, 20, 32, 0.82);
    --text: #e8e8f0;
    --muted: #9a9ab0;
    --accent: #b48cff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: system-ui, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .panel {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 18px;
    padding: 12px 18px; max-width: calc(100% - 32px);
    background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
    font-size: 13px; user-select: none;
  }
  .panel label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .panel output { color: var(--text); min-width: 2ch; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 110px; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
  button {
    background: rgba(255,255,255,0.08); color: var(--text);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
    padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,0.16); }
  button.primary { background: var(--accent); color: #140b24; border-color: transparent; font-weight: 600; }
  .hint {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: var(--muted); font-size: 15px; pointer-events: none; text-align: center;
    transition: opacity .6s;
  }
  .hint.hidden { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">画面をなぞって描いてみよう<br><small>Z: 元に戻す ・ C: クリア ・ S: 保存</small></div>

<div class="panel">
  <label>対称 <input id="sym" type="range" min="2" max="24" value="8"><output id="symOut">8</output></label>
  <label>太さ <input id="width" type="range" min="1" max="20" value="4"><output id="widthOut">4</output></label>
  <label><input id="mirror" type="checkbox" checked> 鏡像</label>
  <label><input id="glow" type="checkbox" checked> 発光</label>
  <button id="undo" title="Z">↶ 戻す</button>
  <button id="clear" title="C">クリア</button>
  <button id="save" class="primary" title="S">PNG保存</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const symEl = $('sym'), widthEl = $('width'), mirrorEl = $('mirror'), glowEl = $('glow');

const BG = '#0b0b12';
let dpr = 1, W = 0, H = 0;
let hue = Math.random() * 360;
let last = null;         // 直前のポインタ位置（中心基準）
let smoothSpeed = 0;
const history = [];      // 元に戻す用スナップショット
const MAX_HISTORY = 25;

function resize() {
  // 既存の絵を保ったままリサイズする
  const prev = W ? ctx.getImageData(0, 0, canvas.width, canvas.height) : null;
  const prevW = canvas.width, prevH = canvas.height;
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (prev) ctx.putImageData(prev, (canvas.width - prevW) / 2, (canvas.height - prevH) / 2);
  history.length = 0;
}

function clearCanvas() {
  pushHistory();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function pushHistory() {
  history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (history.length > MAX_HISTORY) history.shift();
}

function undo() {
  const snap = history.pop();
  if (!snap) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.putImageData(snap, 0, 0);
}

function toCenter(e) {
  return { x: e.clientX - W / 2, y: e.clientY - H / 2 };
}

// 1本の線分を、対称数ぶん回転（＋鏡像）して描く
function drawSegment(a, b, speed) {
  const n = +symEl.value;
  const mirror = mirrorEl.checked;
  const base = +widthEl.value;

  // 速さで色相・明るさ・太さが変わる
  hue = (hue + 0.6 + speed * 0.15) % 360;
  const light = Math.min(78, 52 + speed * 0.9);
  const lw = Math.max(0.6, base * (1.3 - Math.min(speed, 40) / 50));
  const color = `hsl(${hue}, 90%, ${light}%)`;

  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, (W / 2) * dpr, (H / 2) * dpr);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = lw;
  ctx.strokeStyle = color;
  ctx.globalCompositeOperation = 'lighter';
  if (glowEl.checked) { ctx.shadowColor = color; ctx.shadowBlur = lw * 3; }

  const step = (Math.PI * 2) / n;
  for (let i = 0; i < n; i++) {
    ctx.save();
    ctx.rotate(step * i);
    line(a, b);
    if (mirror) { ctx.scale(1, -1); line(a, b); }
    ctx.restore();
  }
  ctx.restore();
}

function line(a, b) {
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pushHistory();
  last = toCenter(e);
  smoothSpeed = 0;
  $('hint').classList.add('hidden');
  drawSegment(last, { x: last.x + 0.01, y: last.y }, 0); // 点を打つ
});

canvas.addEventListener('pointermove', e => {
  if (!last) return;
  // 合体イベントも拾って滑らかに
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of events) {
    const p = toCenter(ev);
    const d = Math.hypot(p.x - last.x, p.y - last.y);
    if (d < 0.5) continue;
    smoothSpeed = smoothSpeed * 0.8 + d * 0.2;
    drawSegment(last, p, smoothSpeed);
    last = p;
  }
});

const end = () => { last = null; };
canvas.addEventListener('pointerup', end);
canvas.addEventListener('pointercancel', end);

function save() {
  const a = document.createElement('a');
  const t = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  a.download = `kaleidoscope-${t}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

symEl.addEventListener('input', () => $('symOut').textContent = symEl.value);
widthEl.addEventListener('input', () => $('widthOut').textContent = widthEl.value);
$('undo').addEventListener('click', undo);
$('clear').addEventListener('click', clearCanvas);
$('save').addEventListener('click', save);

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'z' || (e.ctrlKey && k === 'z')) { e.preventDefault(); undo(); }
  else if (k === 'c' && !e.ctrlKey) clearCanvas();
  else if (k === 's') { e.preventDefault(); save(); }
});

let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 100); });
resize();
</script>
</body>
</html>
